name: Bug Report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: FileTree version
      placeholder: "e.g. 0.1.0 (run `filetree --version`)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.3 (run `python --version`)"
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal / Shell
      placeholder: "e.g. kitty / zsh, GNOME Terminal / bash"

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `filetree . --flag`
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Actual output / error
      render: shell
